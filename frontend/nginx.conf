server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router handles paths like /cases/1 client-side,
    # so any unknown path must still serve index.html rather than 404ing
    # (otherwise a hard refresh or direct link on a case page would fail).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
